services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sxcclubs
      POSTGRES_USER: sxcclubs
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "5432:5432"
    volumes:
      - sxc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sxcclubs -d sxcclubs"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sxc-postgres:
